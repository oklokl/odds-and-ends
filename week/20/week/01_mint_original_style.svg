<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080">
  <title>Mint Android widget background</title>
  <desc>Scalable decorative rounded mint card; translucent curves remain at the edges to leave center free for a clock and calendar.</desc>
  <defs>
    <clipPath id="card-clip"><rect x="0" y="0" width="1440" height="1080" rx="112" ry="112"/></clipPath>
  </defs>
  <g clip-path="url(#card-clip)">
    
    <rect width="1440" height="1080" fill="#D2FCE8"/>
    <!-- corner color washes, approximating the reference without bitmap texture -->
    <path d="M 0,0 H 420 C 388,92 331,144 250,176 C 157,210 65,254 0,315 Z" fill="#78DDB8" fill-opacity=".70"/>
    <path d="M 0,0 H 655 C 563,124 483,153 318,160 C 187,163 92,214 0,326 Z" fill="#9CE9CD" fill-opacity=".49"/>
    <path d="M 0,295 C 95,255 193,190 319,166 C 493,134 562,102 641,0 H 885 C 811,118 668,184 520,199 C 285,224 113,281 0,355 Z" fill="#C8F9E2" fill-opacity=".73"/>
    <!-- right upper curve -->
    <path d="M 999,0 H 1440 V 251 C 1295,240 1146,197 1073,107 C 1034,60 1019,24 999,0 Z" fill="#85E1BC" fill-opacity=".36"/>
    <!-- delicate broad sweep on the bottom left -->
    <path d="M 0,876 C 162,861 279,893 401,977 C 482,1030 562,1066 635,1080 H 0 Z" fill="#9FECD1" fill-opacity=".70"/>
    <path d="M 272,1080 C 400,1004 478,954 634,934 C 815,906 912,935 1070,876 C 1220,820 1337,710 1440,651 V 1080 Z" fill="#8CE5C4" fill-opacity=".42"/>
    <!-- sweeping deeper green lower-right band -->
    <path d="M 912,1080 C 1026,1013 1053,906 1160,837 C 1254,779 1364,766 1440,755 V 1080 Z" fill="#70D8B5" fill-opacity=".68"/>
    <path d="M 1061,1080 C 1199,1030 1316,961 1440,911 V 1080 Z" fill="#65D6B0" fill-opacity=".16"/>

  </g>
</svg>