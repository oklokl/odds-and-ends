<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>PushPop pressed button</title>
  <defs>
    <radialGradient id="body" cx="50%" cy="46%" r="65%">
      <stop offset="0" stop-color="#d92e35"/>
      <stop offset="0.65" stop-color="#b91622"/>
      <stop offset="1" stop-color="#760b18"/>
    </radialGradient>
    <linearGradient id="pressedDepth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>
    <radialGradient id="innerRecess" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.75" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <!-- Inverted / pressed socket appearance perfectly centered at 256,256 -->
  <g>
    <!-- Socket inner rim shadow -->
    <circle cx="256" cy="256" r="222" fill="#000000" opacity="0.32" filter="url(#shadow)"/>
    <circle cx="256" cy="256" r="222" fill="#000000" opacity="0.2"/>
    <!-- Recessed button body -->
    <circle cx="256" cy="256" r="218" fill="url(#body)"/>
    <!-- Inward depth overlays -->
    <circle cx="256" cy="256" r="218" fill="url(#pressedDepth)"/>
    <circle cx="256" cy="256" r="218" fill="url(#innerRecess)"/>
    <!-- Dark rim outline -->
    <circle cx="256" cy="256" r="218" fill="none" stroke="#000000" stroke-width="3.5" opacity="0.32"/>
    <!-- Inverted dome arc highlight -->
    <path d="M140 220 A130 130 0 0 1 256 126 A130 130 0 0 1 372 220" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>