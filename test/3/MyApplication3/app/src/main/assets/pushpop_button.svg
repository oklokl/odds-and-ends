<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="buttonFill" cx="34%" cy="28%" r="76%">
      <stop offset="0" stop-color="#ff8d92"/>
      <stop offset="0.32" stop-color="#ff4f5a"/>
      <stop offset="0.72" stop-color="#f32336"/>
      <stop offset="1" stop-color="#b80d24"/>
    </radialGradient>
    <linearGradient id="lowerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.36"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="30%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/>
      <feOffset dy="8" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.38"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <!-- Raised, plump push-pop button perfectly centered at 256,256 -->
  <g>
    <!-- Soft depth shadow into well -->
    <circle cx="256" cy="260" r="218" fill="#000000" opacity="0.32" filter="url(#shadow)"/>
    <!-- Outer socket seating rim -->
    <circle cx="256" cy="256" r="222" fill="#000000" opacity="0.12"/>
    <!-- Main 3D spherical dome -->
    <circle cx="256" cy="256" r="218" fill="url(#buttonFill)"/>
    <circle cx="256" cy="256" r="218" fill="url(#lowerShade)"/>
    <!-- Concentric edge definition -->
    <circle cx="256" cy="256" r="217" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.32"/>
    <circle cx="256" cy="256" r="218" fill="none" stroke="#000000" stroke-width="2.5" opacity="0.22"/>
    <!-- Spherical glossy highlight / shine -->
    <ellipse cx="196" cy="186" rx="72" ry="42" fill="url(#shine)" transform="rotate(-30 196 186)"/>
    <ellipse cx="188" cy="178" rx="28" ry="16" fill="#ffffff" opacity="0.45" filter="url(#softGlow)" transform="rotate(-30 188 178)"/>
    <ellipse cx="184" cy="174" rx="18" ry="10" fill="#ffffff" opacity="0.82" transform="rotate(-30 184 174)"/>
    <ellipse cx="218" cy="160" rx="9" ry="5" fill="#ffffff" opacity="0.38" transform="rotate(-30 218 160)"/>
  </g>
</svg>